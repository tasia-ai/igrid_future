name: OpenSim cross-platform build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: opensim-linux
            package: opensim-linux.tar.gz
          - os: windows-latest
            artifact: opensim-windows
            package: opensim-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source on Linux
        if: runner.os == 'Linux'
        uses: actions/checkout@v4

      - name: Download source on Windows without archival docs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'opensim-source.zip'
          $extractScript = Join-Path $env:RUNNER_TEMP 'extract-opensim-source.py'
          $url = "https://api.github.com/repos/${{ github.repository }}/zipball/${{ github.sha }}"

          Write-Host "Downloading source archive for ${{ github.sha }}"
          Invoke-WebRequest `
            -Uri $url `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -OutFile $archive

          @'
          import pathlib
          import shutil
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          extracted = 0
          skipped_docs = 0

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  parts = pathlib.PurePosixPath(info.filename).parts
                  if len(parts) <= 1:
                      continue

                  relative_parts = parts[1:]

                  # The repository contains both Docs/ and docs/. Windows is
                  # case-insensitive, so preserve Docs/ but completely skip
                  # lowercase archival docs/, which contains illegal names.
                  if relative_parts[0] == 'docs':
                      skipped_docs += 1
                      continue

                  target = (destination.joinpath(*relative_parts)).resolve()
                  try:
                      target.relative_to(destination)
                  except ValueError:
                      raise RuntimeError(f'Unsafe archive path: {info.filename}')

                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info, 'r') as source, open(target, 'wb') as output:
                      shutil.copyfileobj(source, output)
                  extracted += 1

          if skipped_docs == 0:
              raise RuntimeError('Expected lowercase docs/ entries were not found in source archive')

          print(f'Extracted {extracted} files; skipped {skipped_docs} lowercase docs/ entries.')
          '@ | Set-Content -Path $extractScript -Encoding UTF8

          python $extractScript $archive $PWD
          if ($LASTEXITCODE -ne 0) {
            throw "Source extraction failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path 'OpenSim.sln')) {
            throw 'OpenSim.sln was not extracted'
          }

          Write-Host 'Windows-safe source tree is ready.'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show .NET information
        run: dotnet --info

      - name: Restore Release dependencies
        run: dotnet restore OpenSim.sln -p:Configuration=Release

      - name: Build Release
        run: dotnet build OpenSim.sln --configuration Release --no-restore

      - name: Build Quick-G for Windows package
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Compile Quick-G
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location Quick-G
          # This checkout has no generated go.sum. Explicit module-update mode
          # lets Go resolve the pinned dependency and write checksums even when
          # the runner has GOFLAGS=-mod=readonly configured globally.
          go test -mod=mod ./...
          if ($LASTEXITCODE -ne 0) {
            throw "Quick-G tests failed with exit code $LASTEXITCODE"
          }
          go build -mod=mod -trimpath -ldflags "-s -w" -o ../build/Release/Quick-G.exe .
          if ($LASTEXITCODE -ne 0) {
            throw "Quick-G build failed with exit code $LASTEXITCODE"
          }
          Pop-Location
          if (-not (Test-Path build/Release/Quick-G.exe)) {
            throw 'Quick-G.exe was not produced'
          }

      - name: Restore official OpenSim Windows native libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstreamCommit = 'f358183cbbeb9a206a4d24d8be9715affc530e02'
          $baseUrl = "https://raw.githubusercontent.com/opensim/opensim/$upstreamCommit/bin/lib64"
          $lib64 = 'build/Release/lib64'

          # Windows x64 native files shipped by the matching upstream OpenSim tree.
          # Size checks make the build fail instead of silently packaging an HTML/404
          # response or an incomplete DLL.
          $nativeFiles = [ordered]@{
            'BulletSim-2.86-20170903-x86_64.dll' = 1653760
            'BulletSim-3.26-20231207-x86_64.dll' = 1005568
            'BulletSim.dll'                       = 1005568
            'BulletSimVersionInfo'                = 241
            'e_sqlite3.dll'                       = 1911296
            'openjpeg-dotnet-x86_64.dll'          = 215040
            'sqlite3.dll'                         = 1083392
            'ubode.dll'                           = 479232
          }

          New-Item -ItemType Directory -Path $lib64 -Force | Out-Null

          foreach ($entry in $nativeFiles.GetEnumerator()) {
            $name = $entry.Key
            $expectedSize = [int64]$entry.Value
            $destination = Join-Path $lib64 $name
            $url = "$baseUrl/$name"

            Write-Host "Downloading official OpenSim Windows native file: $name"
            Invoke-WebRequest -Uri $url -OutFile $destination

            $downloaded = Get-Item $destination -ErrorAction Stop
            if ($downloaded.Length -ne $expectedSize) {
              throw "Unexpected size for $name: $($downloaded.Length) bytes; expected $expectedSize"
            }

            Write-Host "Verified $name ($($downloaded.Length) bytes)"
          }

          # OpenMetaverse.dll.config maps the library inside lib64. Keep these
          # root aliases too because direct .NET P/Invoke may probe beside the EXE.
          $openJpeg = Join-Path $lib64 'openjpeg-dotnet-x86_64.dll'
          Copy-Item $openJpeg 'build/Release/openjpeg-dotnet.dll' -Force
          Copy-Item $openJpeg 'build/Release/openjpeg-dotnet-x86_64.dll' -Force

          Write-Host 'Windows native library set restored successfully:'
          Get-ChildItem $lib64 -File |
            Where-Object { $_.Name -in $nativeFiles.Keys } |
            Sort-Object Name |
            ForEach-Object { Write-Host "  $($_.Name) - $($_.Length) bytes" }

      - name: Verify memory limiter assembly was built
        shell: pwsh
        run: |
          $monitoring = Get-ChildItem -Path build/Release -Recurse -Filter OpenSim.Framework.Monitoring.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $monitoring) {
            throw "OpenSim.Framework.Monitoring.dll was not produced"
          }
          Write-Host "Memory limiter assembly: $($monitoring.FullName)"

          $opensim = Get-ChildItem -Path build/Release -Recurse -Filter OpenSim.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($opensim) {
            Write-Host "OpenSim assembly: $($opensim.FullName)"
          }

          $robust = Get-ChildItem -Path build/Release -Recurse -Filter Robust.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($robust) {
            Write-Host "Robust assembly: $($robust.FullName)"
          }

      - name: Package build output
        shell: pwsh
        run: |
          if (Test-Path artifacts) {
            Remove-Item artifacts -Recurse -Force
          }
          New-Item -ItemType Directory -Path artifacts | Out-Null

          if ("${{ runner.os }}" -eq "Linux") {
            tar -czf "artifacts/${{ matrix.package }}" -C build/Release .
            if ($LASTEXITCODE -ne 0) {
              throw "tar failed with exit code $LASTEXITCODE"
            }
          }
          elseif ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path "build/Release/*" -DestinationPath "artifacts/${{ matrix.package }}" -CompressionLevel Optimal
          }
          else {
            throw "Unsupported runner OS: ${{ runner.os }}"
          }

          $package = Get-Item "artifacts/${{ matrix.package }}" -ErrorAction Stop
          if ($package.Length -le 0) {
            throw "Package is empty: $($package.FullName)"
          }
          Write-Host "Created package: $($package.FullName) ($($package.Length) bytes)"

      - name: Upload compiled package to build server by FTP
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          FTP_HOST: panel2.easierit.org
          FTP_PORT: '21'
          FTP_USER: tasiagit
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: server
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          @'
          import ftplib
          import os
          import pathlib
          import time

          host = os.environ['FTP_HOST']
          port = int(os.environ.get('FTP_PORT', '21'))
          user = os.environ['FTP_USER']
          password = os.environ.get('FTP_PASSWORD', '')
          remote_dir = os.environ.get('FTP_REMOTE_DIR', 'server').strip('/ ')
          package_name = os.environ['PACKAGE_NAME']
          local_path = pathlib.Path('artifacts') / package_name

          max_attempts = 5
          block_size = 256 * 1024

          if not password:
              raise RuntimeError('FTP_PASSWORD GitHub secret is not configured')

          if not local_path.is_file() or local_path.stat().st_size <= 0:
              raise RuntimeError(f'Package missing or empty: {local_path}')

          total_bytes = local_path.stat().st_size
          total_mib = total_bytes / (1024 * 1024)
          temp_name = package_name + '.uploading'
          remote_path = f'/{remote_dir}/{package_name}' if remote_dir else f'/{package_name}'

          def connect_ftp():
              print(f'Connecting by plain FTP to {host}:{port} as {user}...', flush=True)
              ftp = ftplib.FTP()
              ftp.connect(host=host, port=port, timeout=600)
              ftp.login(user=user, passwd=password)
              ftp.set_pasv(True)
              ftp.cwd('/')

              if remote_dir:
                  for directory in pathlib.PurePosixPath(remote_dir).parts:
                      if directory in ('', '.', '/'):
                          continue
                      try:
                          ftp.cwd(directory)
                      except ftplib.error_perm as exc:
                          if not str(exc).startswith('550'):
                              raise
                          print(f'Creating FTP directory: {directory}', flush=True)
                          ftp.mkd(directory)
                          ftp.cwd(directory)

              return ftp

          def remote_size(ftp, name):
              try:
                  ftp.voidcmd('TYPE I')
                  value = ftp.size(name)
                  return int(value or 0)
              except ftplib.error_perm as exc:
                  if str(exc).startswith('550'):
                      return 0
                  raise

          print(f'Uploading {local_path} -> {remote_path}', flush=True)
          print(f'Package size: {total_mib:.1f} MiB', flush=True)

          uploaded = False
          last_error = None

          for attempt in range(1, max_attempts + 1):
              ftp = None
              try:
                  print(f'FTP upload attempt {attempt}/{max_attempts}', flush=True)
                  ftp = connect_ftp()

                  offset = remote_size(ftp, temp_name)
                  if offset > total_bytes:
                      print(
                          f'Remote temporary file is larger than local file '
                          f'({offset} > {total_bytes}); restarting from zero.',
                          flush=True,
                      )
                      ftp.delete(temp_name)
                      offset = 0
                  elif offset == total_bytes:
                      print('Temporary upload is already complete; finalizing it.', flush=True)
                      uploaded = True
                      break
                  elif offset > 0:
                      print(
                          f'Resuming at {offset / (1024 * 1024):.1f} / '
                          f'{total_mib:.1f} MiB ({offset * 100.0 / total_bytes:.1f}%).',
                          flush=True,
                      )
                  else:
                      print('Starting upload from 0.0 MiB.', flush=True)

                  progress = {
                      'bytes': offset,
                      'started': time.monotonic(),
                      'attempt_start_bytes': offset,
                      'last_report': 0.0,
                  }

                  def upload_progress(block):
                      progress['bytes'] += len(block)
                      now = time.monotonic()
                      finished = progress['bytes'] >= total_bytes

                      if not finished and now - progress['last_report'] < 5.0:
                          return

                      elapsed = max(now - progress['started'], 0.001)
                      transferred_this_attempt = progress['bytes'] - progress['attempt_start_bytes']
                      speed_mib = transferred_this_attempt / (1024 * 1024) / elapsed
                      uploaded_mib = progress['bytes'] / (1024 * 1024)
                      percent = min(progress['bytes'] * 100.0 / total_bytes, 100.0)
                      print(
                          f'FTP progress: {uploaded_mib:.1f} / {total_mib:.1f} MiB '
                          f'({percent:.1f}%) @ {speed_mib:.2f} MiB/s',
                          flush=True,
                      )
                      progress['last_report'] = now

                  with local_path.open('rb') as source:
                      source.seek(offset)
                      try:
                          ftp.storbinary(
                              f'STOR {temp_name}',
                              source,
                              blocksize=block_size,
                              callback=upload_progress,
                              rest=offset if offset else None,
                          )
                      except ftplib.error_perm:
                          if offset <= 0:
                              raise

                          # Some old FTP servers allow SIZE but reject REST for STOR.
                          print(
                              'Server rejected resumed STOR; restarting this attempt from zero.',
                              flush=True,
                          )
                          try:
                              ftp.delete(temp_name)
                          except ftplib.error_perm as delete_exc:
                              if not str(delete_exc).startswith('550'):
                                  raise

                          source.seek(0)
                          progress['bytes'] = 0
                          progress['attempt_start_bytes'] = 0
                          progress['started'] = time.monotonic()
                          progress['last_report'] = 0.0
                          ftp.storbinary(
                              f'STOR {temp_name}',
                              source,
                              blocksize=block_size,
                              callback=upload_progress,
                          )

                  completed_size = remote_size(ftp, temp_name)
                  if completed_size != total_bytes:
                      raise RuntimeError(
                          f'FTP upload size mismatch: remote={completed_size}, local={total_bytes}'
                      )

                  uploaded = True
                  break

              except (OSError, EOFError, TimeoutError, ftplib.error_temp, ftplib.error_reply, ftplib.error_proto) as exc:
                  last_error = exc
                  print(
                      f'FTP connection/transfer failed on attempt {attempt}: '
                      f'{type(exc).__name__}: {exc}',
                      flush=True,
                  )
                  if attempt >= max_attempts:
                      break

                  delay = attempt * 10
                  print(
                      f'Reconnecting in {delay}s; partial .uploading file will be resumed.',
                      flush=True,
                  )
                  time.sleep(delay)

              finally:
                  if ftp is not None:
                      try:
                          ftp.quit()
                      except Exception:
                          try:
                              ftp.close()
                          except Exception:
                              pass

          if not uploaded:
              raise RuntimeError(
                  f'FTP upload failed after {max_attempts} attempts: {last_error}'
              )

          ftp = connect_ftp()
          try:
              completed_size = remote_size(ftp, temp_name)
              if completed_size != total_bytes:
                  raise RuntimeError(
                      f'Cannot finalize FTP upload: remote={completed_size}, local={total_bytes}'
                  )

              try:
                  ftp.delete(package_name)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith('550'):
                      raise

              ftp.rename(temp_name, package_name)
              print(f'FTP upload complete: {remote_path}', flush=True)
          finally:
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()
          '@ | python -
