name: Tranquillity integration validation

on:
  push:
    branches:
      - integration/tranquillity-v1.1.2-win11-pgsql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-offline-tests:
    name: Build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Activate Nerdbank.GitVersioning
        uses: dotnet/nbgv@v0.5.2

      - name: Restore solution
        run: dotnet restore ./Tranquillity.sln

      - name: Restore offline test projects
        run: |
          dotnet restore ./Tests/OpenSim.Framework.Tests/OpenSim.Framework.Tests.csproj
          dotnet restore ./Tests/OpenSim.Region.OptionalModules.ServerSideBaking.Tests/OpenSim.Region.OptionalModules.ServerSideBaking.Tests.csproj
          dotnet restore ./Tests/OpenSim.Region.ScriptEngine.Tests/OpenSim.Region.ScriptEngine.Tests.csproj

      - name: Build solution
        run: dotnet build ./Tranquillity.sln --configuration Release --no-restore -p:PlatformTarget=x64

      - name: Run framework unit tests
        run: dotnet test ./Tests/OpenSim.Framework.Tests/OpenSim.Framework.Tests.csproj --configuration Release --no-restore -p:PlatformTarget=x64

      - name: Run ServerSideBaking unit tests
        run: dotnet test ./Tests/OpenSim.Region.OptionalModules.ServerSideBaking.Tests/OpenSim.Region.OptionalModules.ServerSideBaking.Tests.csproj --configuration Release --no-restore -p:PlatformTarget=x64

      - name: Build standalone script-engine tests
        run: dotnet build ./Tests/OpenSim.Region.ScriptEngine.Tests/OpenSim.Region.ScriptEngine.Tests.csproj --configuration Release --no-restore -p:PlatformTarget=x64

      - name: Run database-free script-engine regressions
        run: dotnet test ./Tests/OpenSim.Region.ScriptEngine.Tests/OpenSim.Region.ScriptEngine.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~LSL_TypesTestLSLFloat|FullyQualifiedName~LSL_ApiUserTests" -p:PlatformTarget=x64
