server {
    listen 443 ssl http2;
    server_name os.tasia.work.gd;

    # ssl_certificate     /etc/letsencrypt/live/os.tasia.work.gd/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/os.tasia.work.gd/privkey.pem;

    location = /ostools/currency.php {
        proxy_pass http://127.0.0.1:8015/currency.php;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ostools/landtool.php {
        proxy_pass http://127.0.0.1:8015/landtool.php;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ostools/healthz {
        proxy_pass http://127.0.0.1:8015/healthz;
        proxy_set_header Host $host;
    }
    # Pretty profile URLs: /ostools/profile/Name -> profile.php handled by .htaccess / php
    # Economy landing: /ostools/ -> index.php
}
