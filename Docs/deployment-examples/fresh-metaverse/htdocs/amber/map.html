<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fresh Metaverse Map - Amber</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6fb;color:#342737;font-family:Nunito,system-ui,sans-serif;overflow:hidden}
.top{height:64px;background:#fff;border-bottom:1px solid #eadfed;box-shadow:0 2px 12px rgba(66,55,82,.12);display:flex;align-items:center;gap:14px;padding:10px 16px;position:relative;z-index:3}
.brand{font-family:Pacifico,cursive;color:#c14b7a;font-size:22px;text-decoration:none;white-space:nowrap}.search{flex:1;max-width:620px;display:flex;background:#f7f3f8;border:1px solid #eadfed;border-radius:999px;overflow:hidden}
.search input{flex:1;border:0;background:transparent;padding:13px 16px;font:700 14px Nunito;outline:0;color:#342737}.search button{border:0;background:#ff8fab;color:#fff;font-weight:800;padding:0 18px;cursor:pointer}
.pill{background:#fff0f6;color:#944060;border:1px solid #ffd5e5;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap}.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 64px)}
.side{background:#fff;border-right:1px solid #eadfed;overflow:auto;padding:14px;z-index:2}.side h1{font-size:18px;margin:4px 0 4px}.muted{color:#806d7b;font-size:13px;line-height:1.35}.list{display:grid;gap:10px;margin-top:14px}.item{border:1px solid #eadfed;border-radius:16px;background:linear-gradient(180deg,#fff,#fff7fb);padding:12px;box-shadow:0 3px 12px rgba(255,143,171,.10);cursor:pointer}.item:hover,.item.active{border-color:#ff8fab;box-shadow:0 8px 22px rgba(255,143,171,.20)}.item b{display:block;color:#4a3040}.item small{color:#806d7b}.item a{display:inline-block;margin-top:8px;background:#ff8fab;color:#fff;text-decoration:none;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
.map{position:relative;overflow:hidden;background:#e8eef2;background-image:linear-gradient(90deg,rgba(255,255,255,.65) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.65) 1px,transparent 1px);background-size:64px 64px}.controls{position:absolute;right:18px;top:18px;display:grid;gap:8px;z-index:2}.controls button{width:42px;height:42px;border:0;background:#fff;border-radius:10px;font-size:22px;font-weight:800;box-shadow:0 2px 10px rgba(66,55,82,.18);cursor:pointer}.canvas{position:absolute;inset:0;transform-origin:0 0}.tile{position:absolute;border-radius:14px;background:linear-gradient(135deg,#ffb5d8,#e8dff5);border:2px solid rgba(255,255,255,.9);box-shadow:0 8px 20px rgba(66,55,82,.22);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#4a3040;font-weight:900;font-size:13px;cursor:pointer;overflow:hidden}.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 45%);pointer-events:none}.tile span{position:relative;z-index:1;text-shadow:0 1px 0 #fff}.tile.active{outline:4px solid #ff8fab;background:linear-gradient(135deg,#ff8fab,#ffe0ea)}.info{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;border:1px solid #eadfed;border-radius:18px;box-shadow:0 10px 30px rgba(66,55,82,.20);padding:12px 14px;min-width:280px;max-width:480px;z-index:2;display:none}.info.open{display:block}.info b{display:block}.info a{display:inline-block;margin-top:8px;background:#ff8fab;color:#fff;text-decoration:none;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900}.empty{padding:20px;color:#806d7b}
@media(max-width:820px){body{overflow:auto}.top{height:auto;flex-wrap:wrap}.layout{display:block;height:auto}.side{height:42vh}.map{height:58vh}.brand{width:100%}.search{max-width:none}.pill{display:none}}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/amber/">Fresh Metaverse</a>
  <div class="search"><input id="q" placeholder="Search regions, like MainLand or NintendoLand"><button id="go">Search</button></div>
  <span class="pill">Login: os.tasia.work.gd:22000</span>
  <a class="pill" href="/amber/register.php">Create account</a>
</div>
<main class="layout">
  <aside class="side">
    <h1>World Map</h1>
    <p class="muted">Google-map style overview of Fresh Metaverse regions. Click a tile or list item to teleport.</p>
    <div class="muted" id="count">Loading regions...</div>
    <div class="list" id="list"></div>
  </aside>
  <section class="map" id="map">
    <div class="controls"><button id="zin">+</button><button id="zout">-</button><button id="home">⌂</button></div>
    <div class="canvas" id="canvas"></div>
    <div class="info" id="info"></div>
  </section>
</main>
<script>
let regions=[], scale=1, offsetX=0, offsetY=0, active=null;
const canvas=document.getElementById('canvas'), list=document.getElementById('list'), info=document.getElementById('info');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function apply(){canvas.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`;}
function bounds(){const xs=regions.map(r=>r.x), ys=regions.map(r=>r.y);return{minX:Math.min(...xs),minY:Math.min(...ys)}}
function select(name){active=name;document.querySelectorAll('.tile,.item').forEach(e=>e.classList.toggle('active',e.dataset.name===name));const r=regions.find(x=>x.name===name);if(!r)return;info.className='info open';info.innerHTML=`<b>${esc(r.name)}</b><span class=muted>Grid ${r.x}, ${r.y} • ${r.sizeX}x${r.sizeY}m</span><br><a href="${r.teleport}">Teleport to center</a>`;}
function render(filter=''){const b=bounds();canvas.innerHTML='';list.innerHTML='';const shown=regions.filter(r=>r.name.toLowerCase().includes(filter.toLowerCase()));document.getElementById('count').textContent=`${shown.length} of ${regions.length} regions shown`;if(!shown.length){list.innerHTML='<div class=empty>No regions found.</div>';return;}shown.forEach(r=>{const left=(r.x-b.minX)*74+100, top=(r.y-b.minY)*74+80, w=Math.max(54,Math.min(180,r.sizeX/4)), h=Math.max(54,Math.min(180,r.sizeY/4));const t=document.createElement('div');t.className='tile';t.dataset.name=r.name;t.style.left=left+'px';t.style.top=top+'px';t.style.width=w+'px';t.style.height=h+'px';t.innerHTML=`<span>${esc(r.name)}</span>`;t.onclick=()=>select(r.name);canvas.appendChild(t);const item=document.createElement('div');item.className='item';item.dataset.name=r.name;item.innerHTML=`<b>${esc(r.name)}</b><small>${r.x}, ${r.y} • ${r.sizeX}x${r.sizeY}m</small><br><a href="${r.teleport}">Teleport</a>`;item.onclick=e=>{if(e.target.tagName!=='A')select(r.name)};list.appendChild(item);});if(active)select(active);}
function fit(){if(!regions.length)return;const b=bounds();const maxX=Math.max(...regions.map(r=>r.x-b.minX))*74+360;const maxY=Math.max(...regions.map(r=>r.y-b.minY))*74+260;const map=document.getElementById('map').getBoundingClientRect();scale=Math.max(.45,Math.min(1.25,Math.min(map.width/maxX,map.height/maxY)));offsetX=20;offsetY=20;apply();}
document.getElementById('go').onclick=()=>render(document.getElementById('q').value);document.getElementById('q').oninput=e=>render(e.target.value);document.getElementById('zin').onclick=()=>{scale=Math.min(2.8,scale+.2);apply()};document.getElementById('zout').onclick=()=>{scale=Math.max(.35,scale-.2);apply()};document.getElementById('home').onclick=fit;
let dragging=false,sx=0,sy=0,ox=0,oy=0;document.getElementById('map').addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;ox=offsetX;oy=offsetY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging)return;offsetX=ox+e.clientX-sx;offsetY=oy+e.clientY-sy;apply()});
fetch('/amber/map-data.php',{cache:'no-store'}).then(r=>r.json()).then(j=>{regions=(j.regions||[]).sort((a,b)=>a.name.localeCompare(b.name));render();fit();}).catch(()=>{document.getElementById('count').textContent='Map data unavailable.'});
</script>
</body>
</html>
