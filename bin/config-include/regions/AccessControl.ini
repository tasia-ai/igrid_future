[AccessControl]
; Only allow certain viewers, seperated by |
;AllowedClients = ""

; Instead of allowing specific viewers, you can blacklist certain bad ones.
; This is better IMHO, copybots usually identify as legit viewers anyway.
; Please don't block alpha, beta, or personal builds. It is thanks to
; testers that we get all bugs ironed out and a new final release is offered!
DeniedClients = 
;"Firestorm.* +4.7.7.48706|Firestorm.* +6.6.8.68380"|Firestorm.* +6.6.16.70339|Firestorm.* +7.1.9.74745|Firestorm.* +6.6.17.70368|Firestorm Release(x64)? +6.6.17.70368|Firestorm.* +6.2.0|Firestorm.* +4.6.8.42696"|Firestorm.* +6.3.2.58086|Firestorm.* +6.3.8.58105|Firestorm.* +6.4.13.63251|Firestorm.* +6.4.23.64823|Singularity.* +1.8.7.7610"
;"${Viewers|ds_copybot}|${Viewers|hs_copybot}|${Viewers|rv_copybot}|${Viewers|Firestorm_bad_mapspam}|${Viewers|Firestorm_bad_varlog}|${Viewers|Firestorm_bad_inv}|${Viewers|Firestorm_bad_inv2}|${Viewers|Firestorm_new_bad_version}"
allowedMacs = 
;"Amber NL@os-metavers.fresh-projects.top:8002|User Name@os-metavers.fresh-projects.top:8002"

[AccessControlService]
; SQLite database for IP/hardware ban storage
StorageProvider = "TasiaAddons.LoginSecurity.dll:TasiaAddons.LoginSecurity.Data.SQLiteAccessControlData"
ConnectionString = "Data Source=Data/accesscontrol.db;Version=3"

[EstateManagement]
; Comma-separated list of UUIDs allowed to add/remove estate managers
; Empty or absent = any estate owner can add managers (default)
; Example: EstateManagersAllowed = 12345678-1234-1234-1234-123456789abc
EstateManagersAllowed =

[ToS]
; Terms of Service - shows once to users until they accept
; URL points to nginx -> tos-server container
Enabled = false
TOS_URL = https://tos.yourdomain.com
TOS_Date = 1
StorageProvider = "TasiaAddons.LoginSecurity.dll:TasiaAddons.LoginSecurity.Data.SQLiteToSAcceptanceData"
ConnectionString = "Data Source=Data/accesscontrol.db;Version=3"

[WebStats]
; Enable the built-in WebStats HTTP handler (SStats)
enabled = true
; HTTP Basic Auth for /SStats endpoint
AuthEnabled = true
AuthUsername = marty
AuthPassword = tasia
; Optional: secret path segment to hide stats endpoint (empty = /SStats)
StatsSecret =
; MySQL dual-write: when set, WebStatsModule writes to MySQL so Python dashboard can read it
; Format: same as OpenSim Robust.ini MySQL format
; Data Source=HOST;Database=DB;User ID=USER;Password=PASS;SslMode=None;
; Leave empty to use SQLite-only (no Python dashboard)
MySQLConnectionString = "Data Source=i.let-us.cyou;Database=opensim;User ID=root;Password=aigrid123;SslMode=None;"