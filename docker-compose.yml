services:
  grid-main:
    image: repo.is-on.click/familygrids/tasiaquic #actual version of grid software
    command: sleep infinity
    hostname: grid-main
   #mem_limit: 2g
    volumes:

#####################################################################################################
      - "/home/marty/opensim/Robust.log:/home/grid/opensim/bin/Robust.log"
      - "./logs/grid-main/:/home/grid/opensim/bin/logs"
      - "./services/grid-main-config.ini:/home/grid/opensim/bin/python_config.ini" #service app config
      - "./Robust.HG.ini:/home/grid/opensim/bin/Robust.ini" # For Robust config
      - "./MoneyServer.ini:/home/grid/opensim/bin/MoneyServer.ini" # For money server confiz
      - "./Regions:/home/grid/opensim/bin/Regions/" # For region folder
#####################################################################################################
      - "./assetcache:/home/grid/opensim/bin/assetcache" #For cache
      #- "./fs-assets:/home/grid/opensim/bin/fsassets" # For fassets
      - "/home/marty/opensim/Library/assets/AssetSets.xml:/home/grid/opensim/bin/assets/AssetSets.xml"
      - "/home/marty/opensim/Library/assets/IGridContentScriptsAssetSet:/home/grid/opensim/bin/assets/IGridContentScriptsAssetSet"
      - "/home/marty/opensim/config-include:/home/grid/opensim/bin/config-include/" # For opensim config folder
      - "/home/marty/opensim/Library/inventory:/home/grid/opensim/bin/inventory"
      - "/home/marty/opensim/http/http_404_grid-main.html:/home/grid/opensim/bin/http_404.html:ro"
      - "/home/marty/opensim/http/http_404_grid-main.html:/src/http_404.html:ro"
      - "./services/python.py:/home/grid/opensim/bin/python.py" # For pyrhon programing
      - "./templates:/home/grid/opensim/bin/templates/" #Templates
#####################################################################################################
      - "/home/marty/opensim/ssh2/runsh/main:/var/run/sshd" # For ssh server confiz
      - "/home/marty/opensim/bashrc:/root/.bashrc" #alias thing
      - "./ssh/grid-main.txt:/etc/ssh/sshd_config" # For ssh config
      - "/home/marty/opensim/bashhistory:/root/.bash_history:ro" #block hsitory
      - "/home/marty/opensim/shadow/grid-main.config:/etc/shadow" #password file
#####################################################################################################
      - "/home/marty/opensim/igrid-bin/bin:/home/grid/opensim/bin"
      - "/home/marty/opensim/SSL:/home/grid/opensim/bin/SSL"
      - "dotnet-sockets:/dotnet-sockets"
    environment:
      SIM_NAME: grid-main
      DOTNET_DiagnosticPorts: "/dotnet-sockets/dotnet-monitor.sock,connect,nosuspend"
      SSL_CERT_PASS: mycertpass
    network_mode: host

