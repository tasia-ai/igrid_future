  # =========================================================================
  # dotnet-monitor — scans /dotnet-sockets/ for all sim sockets
  # =========================================================================
  dotnet-monitor:
    image: mcr.microsoft.com/dotnet/monitor:8.0
    container_name: dotnet-monitor
    user: root
    restart: unless-stopped
    ports:
      - "52323:52323"    # Monitor API
      - "52325:52325"    # Prometheus metrics
    environment:
      DotnetMonitor_DiagnosticPort__ConnectionMode: "Listen"
      DotnetMonitor_DiagnosticPort__EndpointName: "/dotnet-sockets/dotnet-monitor.sock"
      DotnetMonitor_Auth__Mode: "Username"
      DotnetMonitor_Auth__Username: marty
      DotnetMonitor_Auth__Password: ai2025
      DotnetMonitor_Metrics__Enabled: "true"
      DotnetMonitor_Metrics__Endpoints: "http://+:52325"
      DotnetMonitor_Storage__DumpTempFolder: "/dumps"
      DotnetMonitor_Storage__LogsTempFolder: "/logs"
      DotnetMonitor_ProcessFilterStrings: "*OpenSim*"
    volumes:
      - dotnet-sockets:/dotnet-sockets:rw    # rw so monitor can create socket
      - ./dumps:/dumps
      - ./logs:/logs
   # =========================================================================
  # ToS Acceptance Server — serves ToS from markdown, records acceptances
  # =========================================================================
  tos-server:
    build:
      context: /home/marty/opensim/docker-tos
      dockerfile: Dockerfile
    container_name: tos-server
    restart: unless-stopped
    ports:
      - "52327:8099"
    volumes:
      - ./db:/data    # shared SQLite DB for acceptance records
    environment:
      TOS_VERSION: "1"
  # =========================================================================
  # Python SStats Dashboard — password-shielded, reads MySQL
  # =========================================================================
  sstats-dashboard:
    build:
      context: /home/marty/opensim/docker-stats
      dockerfile: Dockerfile
    container_name: sstats-dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_HOST: "i.let-us.cyou"
      MYSQL_PORT: "3306"
      MYSQL_DB: "opensim"
      MYSQL_USER: "root"
      MYSQL_PASS: "aigrid123"
      MYSQL_TABLE: stats_session_data
      PROXY_USERNAME: "marty"
      PROXY_PASSWORD: "ai2025"
      SESSION_TIMEOUT: "3600"
      PROXY_PORT: "52326"
      MONITOR_URL: "http://127.0.0.1:52325"

volumes:
  dotnet-sockets:
  
