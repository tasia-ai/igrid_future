Include /etc/ssh/sshd_config.d/*.conf
Port 1809
ListenAddress 0.0.0.0
ListenAddress ::

# Protocol version
Protocol 2

# Host keys (default ones, no need to change)
HostKey /etc/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_ed25519_key

# Authentication settings
PermitRootLogin yes         # Or "no" if you want to disallow root
PasswordAuthentication yes # ✅ This enables password login
PermitEmptyPasswords no     # No blank passwords allowed
ChallengeResponseAuthentication no

# If you're not using SSH keys, disable this (optional)
PubkeyAuthentication no

# PAM (Pluggable Authentication Modules)
UsePAM yes

# Login timing and limits
LoginGraceTime 60
MaxAuthTries 5
MaxSessions 10

# Keep it simple for now
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
Compression no
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive yes

# Logging
LogLevel INFO
SyslogFacility AUTH

# Optional: allow specific users
# AllowUsers marty
