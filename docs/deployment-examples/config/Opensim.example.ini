[Const]
    BaseHostname = "CHANGE_ME_HOST"
    BaseURL = "http://${Const|BaseHostname}"
    PublicPort = "8002"
    PrivURL = ${Const|BaseURL}
    PrivatePort = "8003"
    GridName = "CHANGE_ME_GRID"
    RegionFolderName = SIM
    http_listener_port = 2005

[Startup]
    region_info_source = "filesystem"
    regionload_regionsdir = "./Regions/${Const|RegionFolderName}/Region/"
    InworldRestartShutsDown = false
    meshing = ubODEMeshmerizer
    physics = ubODE
    DefaultScriptEngine = "YEngine"

[Network]
    ConsoleUser = "CHANGE_ME_CONSOLE_USER"
    ConsolePass = "CHANGE_ME_CONSOLE_PASS"
    console_port = ${Const|http_listener_port}
    http_listener_port = ${Const|http_listener_port}
    ExternalHostNameForLSL = ${Const|BaseHostname}

[Architecture]
    Include-Architecture = "config-include/GridHypergrid.ini"

[Messaging]
    Include-messaging = "config-include/regions/messaging.ini"

[Groups]
    Include-groups = "config-include/regions/groups.ini"

[Economy]
    Include-economy = "config-include/regions/economy.ini"

[YEngine]
    Enabled = true

[OSSL]
    Include-osslDefaultEnable = "config-include/osslDefaultEnable.ini"
