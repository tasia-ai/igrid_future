; This is the main configuration file for an instance of OpenSim running in grid mode

[DatabaseService]
    StorageProvider = "OpenSim.Data.MySQL.dll"
    ConnectionString = "Data Source=CHANGE_ME_HOST;Database=opensim;User ID=root;Password=CHANGE_ME_DB_PASSWORD;CharSet=utf8mb4;Old Guids=true;SslMode=None;"
    ; EstateConnectionString = "Data Source=CHANGE_ME_HOST;Database=opensim;User ID=root;Password=CHANGE_ME_DB_PASSWORD;CharSet=utf8mb4;Old Guids=true;SslMode=None;"

[Hypergrid]
    GatekeeperURI = "${Const|BaseURL}:${Const|PublicPort}"
    ; GatekeeperURIAlias = myoldname.something.org
    HomeURI = "${Const|BaseURL}:${Const|PublicPort}"
    ; HomeURIAlias = myoldname.something.org, 127.0.0.1,127.0.0.1:8043

[Modules]
    AssetCaching = "FlotsamAssetCache"
    Include-FlotsamCache = "config-include/FlotsamCache.ini"
    ;Setup_LLProxyLoginModule = "9090/"
    Setup_RestartModule = TasiaAddons.RestartModule.RestartModule
    Setup_MarketplaceRegionModule = TasiaAddons.Marketplace.MarketplaceRegionModule
    Setup_ChatAuditModule = TasiaAddons.ChatAudit.ChatAuditModule
    AuthorizationServices = "RemoteAuthorizationServicesConnector"

[AssetService]
    DefaultAssetLoader = "OpenSim.Framework.AssetLoader.Filesystem.dll"
    AssetLoaderArgs = "assets/AssetSets.xml"
    AssetServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[InventoryService]
    InventoryServerURI = "${Const|PrivURL}:${Const|PrivatePort}"
    ; MaxRetries = 0

[GridInfo]
    GridInfoURI = "${Const|BaseURL}:${Const|PublicPort}"

[GridService]
    GridServerURI = "${Const|PrivURL}:${Const|PrivatePort}"
    ; AllowHypergridMapSearch = true
    ; MapTileDirectory = "./maptiles"
    Gatekeeper="${Const|BaseURL}:${Const|PublicPort}"

[EstateDataStore]
    LocalServiceModule = "OpenSim.Services.Connectors.dll:EstateDataRemoteConnector"

[EstateService]
    EstateServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[Messaging]
    Gatekeeper = "${Const|BaseURL}:${Const|PublicPort}"

[AvatarService]
    AvatarServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[AgentPreferencesService]
    AgentPreferencesServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[PresenceService]
    PresenceServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[UserAccountService]
    UserAccountServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[UserAliasService]
    UserAliasServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[GridUserService]
    GridUserServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[AuthenticationService]
    AuthenticationServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[FriendsService]
    FriendsServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[HGInventoryAccessModule]
    ; OutboundPermission = True
    RestrictInventoryAccessAbroad = False
    ; CheckSeparateAssets = false
    ; RegionHGAssetServerURI = ${Const|BaseURL}:${Const|PublicPort}

[HGAssetService]
    ; DisallowExport ="LSLText"
    ; DisallowImport ="LSLBytecode"

[HGFriendsModule]
    ;LevelHGFriends = 0;

[MapImageService]
    MapImageServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[AuthorizationService]
    ; Authorization disabled - see disabled.php stub
    AuthorizationServerURI = "https://CHANGE_ME_HOST/hg/disabled.php"

[MuteListService]
    MuteListServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[ExperienceService]
    LocalServiceModule = "OpenSim.Services.Connectors.dll:RemoteExperienceServicesConnector"
    ExperienceServerURI = "${Const|BaseURL}:${Const|PrivatePort}"

[NGC.Welcome]
    Enable = true
    MessageUrl = http://nossl.CHANGE_ME_HOST/welcome.php
    TimeoutMs = 1200
    FallbackMessage = Welcome to I-Grid, <USERNAME>!

[RestartModule]
