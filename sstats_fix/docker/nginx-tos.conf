# nginx config for ToS server
# Place in /etc/nginx/sites-available/tos and symlink to sites-enabled/
#
# This proxies your domain's /tos/ path to the tos-server container on port 8099.
# The viewer will load the ToS page in its embedded browser.

server {
    listen 443 ssl http2;
    server_name tos.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/tos.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tos.yourdomain.com/privkey.pem;

    # ToS pages
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ToS API (accept, check)
    location /tos/ {
        proxy_pass http://127.0.0.1:8099/tos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name tos.yourdomain.com;
    return 301 https://$host$request_uri;
}
