[NGC.MACAudit]
Enable = false
LogPath = ./logs/ngc-mac-audit.jsonl
RotateDaily = true
MaxSizeMB = 256
RetentionDays = 30
StoreHashedMAC = true
HashSalt = change-me-please
IncludeIP = true
SyslogEndpoint =
HTTPSinkEndpoint =
HTTPSinkAuthHeader =

; Login chain - inner service to delegate to after ban/maintenance checks
InnerLoginService = OpenSim.Services.LLLoginService.dll:LLLoginService

; Maintenance gate - direct MySQL query (same DB as hgauthnew.php)
; Checks: maintenance mode, viewer blocks, local bans, HG bans
; Set EnableMaintenanceGate = false to disable
EnableMaintenanceGate = false
MaintenanceDbConnectionString = Data Source=HOST;Database=wordpress;User ID=root;Password=YOUR_PASSWORD;SslMode=None;

; AccessControlService for IP/hardware ban checks during login
; Console commands (ban ip, ban mac, ban id0) write to this DB
; Set to empty string to disable ban checks
AccessControlService = TasiaAddons.LoginSecurity.dll:TasiaAddons.LoginSecurity.AccessControlService.AccessControlService

; Terms of Service check - blocks login if ToS not accepted
EnableToSCheck = false
ToSVersion = 1
ToSUrl = https://tos.yourdomain.com
ToSAcceptanceService = TasiaAddons.LoginSecurity.dll:TasiaAddons.LoginSecurity.Data.SQLiteToSAcceptanceData
ToSConnectionString = Data Source=Data/accesscontrol.db;Version=3
